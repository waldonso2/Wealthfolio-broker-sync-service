name: Release

# Publishes a GitHub release when the version in pyproject.toml has no tag yet.
# The install and update scripts deploy the latest release, so a merge to main
# without a version bump changes nothing for users.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pip install "pytest>=8" "pytest-cov>=5" "respx>=0.21" "ruff>=0.6" "mypy>=1.11"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q --cov=brokersync --cov-report=term:skip-covered
      - name: Version
        id: v
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.v.outputs.version }}" '$0 ~ "^## " { p = index($0, v) == 1 } p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --title "v${{ steps.v.outputs.version }}" --notes-file notes.md --target "$GITHUB_SHA"
