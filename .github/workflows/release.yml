name: Release

# Publishes a GitHub release when the version in pyproject.toml has no tag yet.
# The install and update scripts deploy the latest release, so a merge to main
# without a version bump changes nothing for users.
#
# #88: the whole CI runs first (same commit) and only the publish job may write. It builds the
# release archive itself, lists every file's SHA-256 (SHA256SUMS - the update checks the source
# archive it deploys against it) and attests both with GitHub's build provenance (SLSA), so
# `gh attestation verify` shows they come from this workflow and this commit.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      created: ${{ steps.v.outputs.exists == 'false' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: v
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.v.outputs.version }}" '$0 ~ "^## " { p = index($0, v) == 1 } p' CHANGELOG.md > notes.md
          cat notes.md
      - name: Archive and checksums
        if: steps.v.outputs.exists == 'false'
        run: |
          NAME="wealthfolio-broker-sync-${{ steps.v.outputs.version }}"
          git archive --format=tar.gz --prefix="$NAME/" -o "$NAME.tar.gz" HEAD
          mkdir rel && git archive --format=tar HEAD | tar -x -C rel
          (cd rel && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > SHA256SUMS
          sha256sum "$NAME.tar.gz" >> SHA256SUMS.archive
          wc -l SHA256SUMS
      - name: Build provenance
        if: steps.v.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            wealthfolio-broker-sync-${{ steps.v.outputs.version }}.tar.gz
            SHA256SUMS
      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --title "v${{ steps.v.outputs.version }}" \
            --notes-file notes.md --target "$GITHUB_SHA" \
            "wealthfolio-broker-sync-${{ steps.v.outputs.version }}.tar.gz" SHA256SUMS SHA256SUMS.archive

  image:
    # The container image (#148), only for a new version: amd64 and arm64 on ghcr.io, tags v<version> and latest,
    # signed with cosign (keyless, this workflow's identity) and with build provenance in the registry.
    needs: publish
    if: needs.publish.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/wealthfolio-broker-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:v${{ needs.publish.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.publish.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
