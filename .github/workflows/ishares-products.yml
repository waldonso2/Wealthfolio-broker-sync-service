name: iShares products

# src/brokersync/ishares_products.json maps ISIN -> iShares product number, so X-Ray finds an ETF's holdings
# without reading iShares' fund finders (megabytes) in every container. Once a week: read the fund finders
# (scripts/ishares_products.py); when funds were added, push them to a branch, start CI for it and open a pull request (an issue if that is refused).

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write
      issues: write # when the pull request is refused
      actions: write # start CI on that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/probe_ishares.py > probe-out.txt 2>&1 || true
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/o && cp probe-out.txt /tmp/o/ && cp -r probe-files /tmp/o/ 2>/dev/null || true
          cd /tmp/o && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@invalid commit -qm "probe output"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/probe-out
