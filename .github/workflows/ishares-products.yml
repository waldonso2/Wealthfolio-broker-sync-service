name: iShares products

# src/brokersync/ishares_products.json maps ISIN -> iShares product number, so X-Ray finds an ETF's holdings
# without reading iShares' fund finders (megabytes) in every container. Once a week: read the fund finders
# (scripts/ishares_products.py); when funds were added, push them to a branch, start CI for it and open a pull request (an issue if that is refused).

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  products:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write
      issues: write # when the pull request is refused
      actions: write # start CI on that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python scripts/ishares_products.py
      - name: Push new funds and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git diff --quiet -- src/brokersync/ishares_products.json src/brokersync/fund_products.json && { echo "no new funds"; exit 0; }
          BRANCH=ishares-products
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qm "iShares products: new funds from the fund finders" -- src/brokersync/ishares_products.json src/brokersync/fund_products.json
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr list --head "$BRANCH" --state open --json number --jq length | grep -qx 0 || exit 0
          BODY="New ISIN -> product number pairs from iShares' fund finders (scripts/ishares_products.py). Data only: no version bump needed; it ships with the next release."
          # Needs "Allow GitHub Actions to create and approve pull requests" (Settings -> Actions); without it an issue links the branch.
          gh pr create --head "$BRANCH" --title "iShares products: new funds" --body "$BODY" \
            || gh issue create --title "iShares products: new funds on branch $BRANCH" --body "$BODY Open the pull request: https://github.com/${REPO}/compare/main...${BRANCH}?expand=1"
