name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs this whole workflow first and publishes only when every job passed (#88).
  workflow_call:
  # Started by ishares-products.yml for the pull request it opens (a pull request opened with the workflow's
  # own token starts no workflow by itself).
  workflow_dispatch:
  # Weekly, for vulnerabilities found after a release in the locked versions (pip-audit).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Actions are pinned to a commit (a tag can be moved); Dependabot keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11: oldest supported; 3.13: Debian 13 in the LXC.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # The versions the users get (requirements.txt), then the test tools - both hash-checked (#97).
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pip install --no-deps --no-build-isolation -e .
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - run: pip check
      # The browser for test_ui_browser (axe, CSP, phone width); the version matches the locked playwright.
      - run: python -m playwright install --with-deps chromium
      - run: ruff check src tests
      - run: mypy src
      # The coverage of today (93 %) as the floor: it may rise, not erode.
      - run: pytest -q --cov=brokersync --cov-report=term:skip-covered --cov-fail-under=90

  performance:
    # Measured and reported on the run's summary page (KENNZAHLEN.md), never failing the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pip install --no-deps --no-build-isolation -e .
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/perf_service.py -q
        continue-on-error: true

  audit:
    # Known vulnerabilities in the locked runtime versions: a finding fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - run: pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off

  dependency-review:
    # A pull request that adds a dependency with a known vulnerability is flagged.
    uses: waldonso2/quality-kit/.github/workflows/dependency-review.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck ct/*.sh install/*.sh deploy/setup.sh deploy/brokersync-reset-password deploy/brokersync-cli deploy/brokersync-autoupdate scripts/*.sh
      - name: catalog JSON
        run: python3 -m json.tool json/wealthfolio-broker-sync.json > /dev/null
      - name: install from the release tarball layout, like deploy/setup.sh
        run: |
          git archive --format=tar.gz --prefix=app/ HEAD > /tmp/app.tar.gz
          mkdir /tmp/rel && tar -xzf /tmp/app.tar.gz -C /tmp/rel
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --require-hashes --only-binary :all: -r /tmp/rel/app/requirements.txt
          /tmp/venv/bin/pip install --quiet --no-deps --no-build-isolation /tmp/rel/app
          /tmp/venv/bin/pip check
          /tmp/venv/bin/brokersync --version

  workflows:
    # The workflows themselves: injection, permissions, cache poisoning (zizmor).
    uses: waldonso2/quality-kit/.github/workflows/workflows.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1

  secrets:
    # gitleaks over the whole history; allowed test values in .gitleaks.toml.
    uses: waldonso2/quality-kit/.github/workflows/secrets.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shared dedup cases match the addon's copy (contract/dedup/README.md)
        run: |
          url=https://raw.githubusercontent.com/waldonso2/wealthfolio-importer-addon/main/contract/dedup/cases.json
          if ! curl -fsSL "$url" -o /tmp/other.json; then echo "::warning::The addon's copy could not be read - the shared dedup cases were not compared."; exit 0; fi
          diff -u /tmp/other.json contract/dedup/cases.json || { echo "::error::contract/dedup/cases.json differs from the addon's copy - copy it over (this repository's is the leading one)."; exit 1; }
