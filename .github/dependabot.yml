version: 2
updates:
  # requirements.txt / requirements-dev.txt: the locked runtime and CI versions (scripts/lock.sh).
  # Security updates and a weekly round of version updates. pytr is updated by hand (its diff is
  # reviewed, the contract case re-run): only its version updates are ignored, a security update
  # still comes as a pull request (#97).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release must be a week old before it is proposed: time for a compromised one to be pulled.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "pytr"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
