{% extends "base.html" %}{% block title %}{{ _("Anmelden") }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ _("Anmelden") }}</h1>
  <form method="post">
    <label for="pw">{{ _("Passwort") }}</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <div class="actions"><button>{{ _("Anmelden") }}</button></div>
  </form>
  <p class="muted">{{ _("Passwort vergessen? In der Konsole des Containers <code>companion-reset-password</code> ausführen.") }}</p>
</div>
{% endblock %}
