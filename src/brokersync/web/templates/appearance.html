{% extends "base.html" %}{% block title %}{{ _("Darstellung") }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ _("Darstellung") }}</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p class="muted">{{ _("Hell oder dunkel: wie das Gerät. Das Symbol oben schaltet bis zum Abmelden um.") }}</p>
    <label for="language">{{ _("Sprache") }}</label>
    <select id="language" name="language">
      {% for value, label in languages.items() %}<option value="{{ value }}" {{ 'selected' if cfg.ui_language == value }}>{{ label }}</option>{% endfor %}
    </select>
    <div class="actions"><button>{{ _("Speichern") }}</button></div>
  </form>
</div>
{% endblock %}
