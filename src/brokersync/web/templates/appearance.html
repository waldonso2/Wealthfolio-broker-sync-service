{% extends "base.html" %}{% block title %}Darstellung{% endblock %}
{% block content %}
<div class="card">
  <h1>Darstellung</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="theme">Farbschema</label>
    <select id="theme" name="theme">
      {% for value, label in themes.items() %}<option value="{{ value }}" {{ 'selected' if cfg.ui_theme == value }}>{{ label }}</option>{% endfor %}
    </select>
    <label for="language">Sprache</label>
    <select id="language" name="language">
      {% for value, label in languages.items() %}<option value="{{ value }}" {{ 'selected' if cfg.ui_language == value }}>{{ label }}</option>{% endfor %}
    </select>
    <div class="actions"><button>Speichern</button></div>
  </form>
</div>
{% endblock %}
