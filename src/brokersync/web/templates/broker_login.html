{% extends "base.html" %}{% block title %}Anmeldung {{ adapter.label }}{% endblock %}
{% block content %}
<div class="card">
  <h1>Anmeldung bei {{ adapter.label }}</h1>
  <p>{{ challenge.message }}</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if challenge.kind == "code" %}
    <label for="code">Code</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus>
    <div class="actions"><button>Bestätigen</button></div>
    {% else %}
    <input type="hidden" name="code" value="">
    <div class="actions"><button>Ich habe in der App bestätigt</button></div>
    {% endif %}
  </form>
</div>
{% endblock %}
