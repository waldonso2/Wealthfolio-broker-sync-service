[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthfolio-broker-sync"
version = "0.28.2"
description = "Fetches transactions from brokers and writes them, deduplicated, into a self-hosted Wealthfolio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "fastapi>=0.115",
  "fints>=5.0,<6",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  # Unofficial Trade Republic API: pinned, updated deliberately (its login and
  # parsing follow Trade Republic's changes).
  "pytr==0.4.10",
  # SQLCipher for the encrypted state database (module sqlcipher3): sqlcipher3-binary on x86-64,
  # sqlcipher3-wheels (a build of the same module) on ARM64; elsewhere state.db stays plain SQLite
  # (the page Sicherheit says so).
  "sqlcipher3-binary>=0.5; platform_machine == 'x86_64'",
  "sqlcipher3-wheels>=0.5.7; platform_machine == 'aarch64'",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
brokersync = "brokersync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brokersync = ["web/templates/*.html", "web/static/*", "web/static/fonts/*", "common-passwords.txt", "adapters/fints_institutes.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C901", "S", "SIM", "PERF", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # German texts use typographic characters on purpose
    "S603", "S607",  # subprocess with fixed argument lists, never a shell (sc, systemctl, hostname)
    "C408",  # dict(key=...) reads as a record here
]

[tool.ruff.lint.mccabe]
# New code stays below this; the few older functions above it are marked (noqa: C901) and listed in #80.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C901", "S", "RUF012", "RUF043", "RUF059"]  # asserts, fabricated secrets; fakes and unpacked fixtures

[tool.mypy]
ignore_missing_imports = true
